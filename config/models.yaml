targets:
  kia:
    - { model: "e-Niro", aliases: ["e Niro", "eNiro", "Niro EV", "Niro Electric"] }
    - { model: "Niro", aliases: ["Niro"], require_electric: true }   # odfiltruj HEV/PHEV
    - { model: "EV4", aliases: ["EV 4"] }
  hyundai:
    - { model: "Kona Electric", aliases: ["Kona Elektryczna", "Kona EV", "Kona Electric"] }
    - { model: "Kona Electric", aliases: ["Kona"], require_electric: true }   # odfiltruj HEV/spalinowe
    - { model: "Ioniq 5", aliases: ["IONIQ5", "Ioniq5", "IONIQ 5"] }
    # TODO: dopisz "Ioniq 6" jeśli chcesz
  tesla:
    - { model: "Model 3", aliases: ["Model3", "Tesla 3"] }
    - { model: "Model Y", aliases: ["ModelY", "Tesla Y"] }
  volkswagen:
    - { model: "ID.4", aliases: ["ID4", "ID 4", "ID.4 GTX"] }
    - { model: "ID.5", aliases: ["ID5", "ID 5", "ID.5 GTX"] }
brand_aliases:
  volkswagen: ["VW"]
filters:
  max_price_gross_pln: 130000   # null = bez limitu
  min_price_gross_pln: 70000    # tańsze oferty to zwykle cesje leasingu / błędy; null = bez limitu
  max_mileage_km: 122000
  min_year: 2021
notifications:
  enabled: false                # powiadomienie, gdy liczba nowych ofert > 0
  channel: telegram             # telegram | email (dane z zmiennych środowiskowych)

# Sekcja "Alternatywnie" w raporcie: gotowe wyszukiwania na portalach, których NIE skanujemy (tylko linki).
# Otomoto jest skanowane (config/sources.yaml); OLX zwraca 403 na robots.txt, więc tylko linki.
alternatives:
  sites:
    olx:
      name: "OLX"
      url: "https://www.olx.pl/motoryzacja/samochody/{path}/?search%5Bfilter_enum_petrol%5D%5B0%5D=electric"
      price_param: "search%5Bfilter_float_price%3Ato%5D"   # dodawane, gdy filters.max_price_gross_pln != null
  searches:
    - { label: "Kia Niro EV / e-Niro", olx: "kia/q-niro-ev" }
    - { label: "Kia EV4", olx: "kia/q-ev4" }
    - { label: "Hyundai Kona Electric", olx: "hyundai/q-kona-electric" }
    - { label: "Hyundai Ioniq 5", olx: "hyundai/q-ioniq-5" }
    - { label: "Tesla Model 3", olx: "tesla/q-model-3" }
    - { label: "Tesla Model Y", olx: "tesla/q-model-y" }
    - { label: "Volkswagen ID.4", olx: "volkswagen/q-id4" }
    - { label: "Volkswagen ID.5", olx: "volkswagen/q-id5" }
