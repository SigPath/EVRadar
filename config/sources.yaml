sources:
  vwfs:
    name: "VW Financial Services"
    url: "https://store.vwfs.pl"
    delay_min_s: 1
    delay_max_s: 3
  ayvens:
    name: "Ayvens"
    url: "https://www.ayvens.com/pl-pl/"
    params:
      listing_base: "https://usedcars.ayvens.com"   # sklep aut używanych linkowany z ayvens.com
  mauto:
    name: "Mauto"
    url: "https://mauto.pl"
  automarket:
    name: "Automarket"
    url: "https://automarket.pl"
  stellantis:
    name: "Stellantis &You"
    url: "https://www.stellantisandyou.com/pl"
    params:
      # publiczne dane z /content/stellantis-and-you/website/pl/pl.sandy-const.json (algolia.*)
      algolia_app_id: "W73X2DZZYO"
      algolia_api_key: "9dda5853ea0784de6fd5f132280f34f0"   # klucz search-only, serwowany przez stronę
      index: "prod_sandy_used_vehicles_pl"
  poleasingowe:
    name: "Poleasingowe.pl"
    url: "https://poleasingowe.pl"
  otomoto:
    name: "Otomoto"
    url: "https://www.otomoto.pl"
    max_pages: 8                      # 32 oferty na stronę, limit na jedną ścieżkę modelu
    priority: 200                     # agregator: przy duplikacie wygrywa źródło bezpośrednie
    params:
      # Ścieżki <marka>/<model> z Otomoto. UWAGA: nieistniejący slug NIE zwraca błędu — cicho
      # zwraca całą markę (zweryfikowane 2026-10-12: `kia/e-niro` i `hyundai/kona-electric`
      # zwracają całą markę, poprawnie jest `kia/niro` i `hyundai/kona`; `tesla/model-3`,
      # `tesla/y`, `volkswagen/id4`, `volkswagen/id5`, `hyundai/ioniq-5`, `hyundai/ioniq-6`,
      # `kia/ev6` trafiają we właściwy model). Ścieżki muszą pokrywać modele z config/models.yaml
      # — oferta spoza `targets` jest odrzucana, więc martwa ścieżka to tylko zmarnowane żądania.
      exclude_damaged: true             # wytnij oferty z "Uszkodzony: Tak" (dodatkowe zapytanie na ścieżkę)
      paths:
        - kia/niro                      # pokrywa też e-Niro (Otomoto klasyfikuje je jako "Niro")
        - kia/ev6
        - hyundai/kona                  # pokrywa Kona Electric
        - hyundai/ioniq-5
        - hyundai/ioniq-6
        - tesla/model-3
        - tesla/y
        - volkswagen/id4
        - volkswagen/id5
  autoplac:
    name: "Autoplac"
    url: "https://autoplac.pl"
    max_pages: 6                      # 24 oferty na stronę
    priority: 150
    params:
      # ścieżki <marka>/<model> z Autoplac; nieznany slug cicho zwraca całą markę — wykrywamy to
      # po `filters.brandModelIds` (brak ID z "_" = poziom marki). Zweryfikowane 2026-10-13:
      # hyundai/ioniq-6 = model 257_2893 (22 oferty), tesla/model-y = 555_5285 (tesla/y daje ten
      # sam model). Usunięte kia/ev3, kia/ev4, volkswagen/id3, skoda/enyaq — modele nieobecne
      # w config/models.yaml, więc ich wyniki i tak odpadały na dopasowaniu.
      paths:
        - kia/niro
        - kia/ev6
        - hyundai/kona
        - hyundai/ioniq-5
        - hyundai/ioniq-6
        - tesla/model-3
        - tesla/model-y
        - volkswagen/id4
        - volkswagen/id5
  findcar:
    name: "FindCar"
    url: "https://findcar.pl"
    max_pages: 10                     # 15 ofert na stronę; zapytania po markach z config/models.yaml
    priority: 150
