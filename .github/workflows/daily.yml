name: Scan EV Radar (opcjonalny, ręczny)

# Tylko ręczne uruchomienie; raport zostaje artefaktem i NIE trafia na GitHub Pages.
# Część serwisów (np. VWFS) blokuje IP serwerów GitHuba, więc pełny raport powstaje lokalnie:
# publish_report.ps1 -Scan (publikacja na gałąź gh-pages).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync --frozen

      - name: Scan
        run: uv run evradar run --no-open

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evradar-report
          path: out/*.html
          if-no-files-found: warn
          retention-days: 30
