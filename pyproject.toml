[project]
name = "evradar"
version = "0.1.0"
description = "EV Radar — agregator ofert leasingowych/poleasingowych aut elektrycznych"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["electric-vehicles", "leasing", "scraper", "aggregator", "poland"]
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "playwright>=1.45",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "structlog>=24.1",
    "rich>=13.7",
    "typer>=0.12",
    "rapidfuzz>=3.9",
    "tzdata>=2026.4",
]

[project.urls]
Homepage = "https://sigpath.github.io/EVRadar/"
Repository = "https://github.com/SigPath/EVRadar"

[project.scripts]
evradar = "evradar.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evradar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
